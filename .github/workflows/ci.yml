name: IMPÉRIOS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test and Build Game Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compilar Módulo Shared
        run: |
          cd shared
          npm install
          npm run build

      - name: Executar Testes Automatizados no Servidor (Vitest)
        run: |
          cd server
          npm install
          npm test

      - name: Build Web Client
        run: |
          cd client/web
          npm install
          npm run build
